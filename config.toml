# 站点根地址：必须是最终访问域名，且以 / 结尾
# 换域名只改这一行，然后重新构建
base_url = "https://tianyi.win/"

title = "Zola Docs · tianyi.win"
description = "Zola 静态站点生成器文档站，托管于 tianyi.win（Cloudflare Pages）。"

compile_sass = true
build_search_index = true
skip_content_templating = ["themes/**"]

taxonomies = [
  { name = "theme-tags"}
]

[search]
index_format = "elasticlunr_json"

[markdown]
external_links_class = "external"

[markdown.highlighting]
theme = "catppuccin-mocha"
#error_on_missing_language = true

[link_checker]
internal_level = "warn"

[extra]
author = "win-tianyi"
site_name = "tianyi.win"
upstream = "https://github.com/getzola/zola"

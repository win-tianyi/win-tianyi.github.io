<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.5" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="525" rx="170" ry="14" fill="#121212" opacity="0.08"/>

  <!-- 底座 -->
  <rect x="290" y="455" width="220" height="62" rx="14" fill="url(#base)"/>
  <rect x="322" y="438" width="156" height="26" rx="6" fill="#2e2e2e"/>
  <rect x="380" y="415" width="40" height="28" rx="5" fill="#3c3c3c"/>
  <!-- 底座指示灯 -->
  <circle cx="330" cy="470" r="6" fill="#e5484d"/>
  <circle cx="350" cy="470" r="6" fill="#30a46c"/>

  <!-- 腰 -->
  <rect x="388" y="380" width="24" height="42" rx="5" fill="#333333"/>

  <!-- 肩关节 -->
  <circle cx="400" cy="362" r="30" fill="#1a1a1a"/>
  <circle cx="400" cy="362" r="30" fill="none" stroke="#4a4a4a" stroke-width="6"/>
  <circle cx="400" cy="362" r="12" fill="#6b6b6b"/>

  <!-- 大臂 -->
  <line x1="400" y1="362" x2="505" y2="228" stroke="url(#arm)" stroke-width="30" stroke-linecap="round"/>
  <line x1="400" y1="362" x2="505" y2="228" stroke="#ffffff" stroke-width="6" opacity="0.12" stroke-linecap="round" transform="translate(-6,0)"/>

  <!-- 肘关节 -->
  <circle cx="505" cy="228" r="26" fill="#1a1a1a"/>
  <circle cx="505" cy="228" r="26" fill="none" stroke="#4a4a4a" stroke-width="5"/>
  <circle cx="505" cy="228" r="10" fill="#6b6b6b"/>

  <!-- 小臂 -->
  <line x1="505" y1="228" x2="648" y2="282" stroke="url(#arm)" stroke-width="26" stroke-linecap="round"/>

  <!-- 腕关节 -->
  <circle cx="648" cy="282" r="20" fill="#1a1a1a"/>
  <circle cx="648" cy="282" r="20" fill="none" stroke="#4a4a4a" stroke-width="5"/>
  <circle cx="648" cy="282" r="8" fill="#6b6b6b"/>

  <!-- 末端法兰 -->
  <rect x="664" y="272" width="52" height="20" rx="6" fill="#3a3a3a"/>

  <!-- 夹爪 -->
  <rect x="716" y="264" width="12" height="36" rx="4" fill="#1a1a1a"/>
  <rect x="700" y="258" width="8" height="16" rx="3" fill="#3c3c3c"/>
  <rect x="700" y="290" width="8" height="16" rx="3" fill="#3c3c3c"/>
  <rect x="712" y="292" width="8" height="14" rx="3" fill="#3c3c3c"/>
  <rect x="712" y="258" width="8" height="14" rx="3" fill="#3c3c3c"/>
</svg>

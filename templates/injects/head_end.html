<!-- head_end inject: 语言切换按钮改为「中 / E」文字徽标 -->
<style>
  .btn-translations {
    width: auto !important;
    height: 1.5rem !important;
    min-width: 1.5rem !important;
    padding: 0 0.45rem;
    background-image: none !important;
    border: 1px solid currentColor;
    border-radius: 0.45rem;
    letter-spacing: 0;
    font-size: 0 !important;
    line-height: 1;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    opacity: 0.8;
    transition: opacity 0.15s ease;
  }
  .btn-translations:hover,
  .btn-translations:focus-visible {
    opacity: 1;
  }
  .btn-translations::after {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1;
  }
  /* 按钮显示「可切换到的目标语言」：中文页显示 English，英文页显示 中文 */
  html[lang="zh"] .btn-translations::after,
  html[lang^="zh-"] .btn-translations::after { content: "English"; }
  html[lang="en"] .btn-translations::after,
  html[lang^="en-"] .btn-translations::after { content: "中文"; }
  .dark .btn-translations,
  .dark .btn-translations:hover { filter: none !important; }
</style>
